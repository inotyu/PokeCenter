[build]
builder = "NIXPACKS"

[deploy]
startCommand = "cd backend && npm install && npm run build && npm run start:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "pokemon-center-backend"

[services.variables]
NODE_ENV = "production"
PORT = "3001"

[[services]]
name = "pokemon-center-frontend"

[services.variables]
NODE_ENV = "production"
PORT = "3000"
NEXT_PUBLIC_API_URL = "${{services.pokemon-center-backend.url:3001}}"
